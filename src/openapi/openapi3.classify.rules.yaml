# OOB matching rules for REST (OpenAPI 3.x) classify rule IDs.
#
# The classifyRuleId already encodes the subset/not-subset condition, so a
# single rule per ruleId is sufficient — no action or scope disambiguation.
#
# Rule ordering convention: rules are applied in direct array order; the LAST
# matching rule wins. Place more-specific rules after the general catch-all.
#
# breaking → risky reclassification (effectiveBwcScope: NOT_BACKWARD_COMPATIBLE)
# is handled for all ruleIds by general.classify.rules.yaml via the wildcard '*'.

- match:
    classifyRuleId: rest.operation.security.after-security-requirements-are-subset-of-before
  set:
    type: non-breaking

- match:
    classifyRuleId: rest.operation.security.after-security-requirements-are-not-a-subset-of-before
  set:
    type: breaking

- match:
    classifyRuleId: rest.operation.security.item.after-security-requirements-are-subset-of-before
  set:
    type: non-breaking

- match:
    classifyRuleId: rest.operation.security.item.after-security-requirements-are-not-a-subset-of-before
  set:
    type: breaking

# ---------------------------------------------------------------------------
# Parameter Object (add / remove the whole parameter)
# ---------------------------------------------------------------------------
# Parameters are always in request context; no scope overrides needed.

- match:
    classifyRuleId: rest.parameter.after-ignored-header
  set:
    type: unclassified

- match:
    classifyRuleId: rest.parameter.after-required-no-default
  set:
    type: breaking

- match:
    classifyRuleId: rest.parameter.after-optional-or-has-default
  set:
    type: non-breaking

- match:
    classifyRuleId: rest.parameter.before-ignored-header
  set:
    type: unclassified

- match:
    classifyRuleId: rest.parameter.before-not-ignored-header
  set:
    type: breaking

- match:
    classifyRuleId: rest.parameter.replace
  set:
    type: unclassified

# ---------------------------------------------------------------------------
# Parameter Object > explode property
# ---------------------------------------------------------------------------
# annotation when the explode value matches the style default; breaking otherwise.
# Replace is always breaking. No scope overrides (request context only).

- match:
    classifyRuleId: rest.parameter.explode.after-default-for-style
  set:
    type: annotation

- match:
    classifyRuleId: rest.parameter.explode.after-non-default-for-style
  set:
    type: breaking

- match:
    classifyRuleId: rest.parameter.explode.before-default-for-style
  set:
    type: annotation

- match:
    classifyRuleId: rest.parameter.explode.before-non-default-for-style
  set:
    type: breaking

- match:
    classifyRuleId: rest.parameter.explode.replace
  set:
    type: breaking

# ---------------------------------------------------------------------------
# Parameter Object > allowReserved property
# ---------------------------------------------------------------------------
# allowReserved only applies to query parameters; path/cookie/header → unclassified.
# For add and remove the same ruleId is used; the YAML action filter distinguishes
# the outcome (add→non-breaking, remove→breaking).

- match:
    classifyRuleId: rest.parameter.allow-reserved.after-in-non-query
  set:
    type: unclassified

- match:
    classifyRuleId: rest.parameter.allow-reserved.after-in-query
    action: add
  set:
    type: non-breaking

- match:
    classifyRuleId: rest.parameter.allow-reserved.after-in-query
    action: remove
  set:
    type: breaking

- match:
    classifyRuleId: rest.parameter.allow-reserved.replace.after-true
  set:
    type: non-breaking

- match:
    classifyRuleId: rest.parameter.allow-reserved.replace.after-false
  set:
    type: breaking

# ---------------------------------------------------------------------------
# Parameter Object > name property
# ---------------------------------------------------------------------------

- match:
    classifyRuleId: rest.parameter.name.add
  set:
    type: non-breaking

- match:
    classifyRuleId: rest.parameter.name.remove
  set:
    type: breaking

- match:
    classifyRuleId: rest.parameter.name.replace.before-path-param
  set:
    type: annotation

- match:
    classifyRuleId: rest.parameter.name.replace.before-non-path-param
  set:
    type: breaking

# ---------------------------------------------------------------------------
# Parameter Object > required property
# ---------------------------------------------------------------------------

- match:
    classifyRuleId: rest.parameter.required.add
  set:
    type: breaking

- match:
    classifyRuleId: rest.parameter.required.remove
  set:
    type: non-breaking

- match:
    classifyRuleId: rest.parameter.required.replace.after-has-schema-default
  set:
    type: non-breaking

- match:
    classifyRuleId: rest.parameter.required.replace.after-true-no-schema-default
  set:
    type: breaking

- match:
    classifyRuleId: rest.parameter.required.replace.after-false
  set:
    type: non-breaking
